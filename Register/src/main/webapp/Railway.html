<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Xworkz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
<form action="rail" method="post">

       Name<input type="text" name="name">
<pre>
       Source<select name="source">
               <option>select</option>
               <option>Bengalore</option>
               <option>Mysore</option>
               <option>Mandya</option>
               <option>Mangalore</option>
           </select>
               Destination<select name="destination">
               <option>select</option>
               <option>Ooty</option>
               <option>Manali</option>
               <option>US</option>
           </select>
               Start Date<input type="number" name="startDate">
               Return Date<input type="number" name="returnDate">
               Seat type<select name="seatType">
               <option>select</option>
               <option>Sleeper</option>
               <option>General</option>
           </select>
               Total Ticket<input type="number" name="totalTicket">
               No of Male<input type="number" name="noOfMale">
               No of Female<input type="number" name="noOfFemale">
                Book<input type="submit" value="Submit">
           </pre>


</form>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
